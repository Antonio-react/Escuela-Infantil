<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon: la copa del árbol del logo (generado con npm run imagenes). -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf8f3" />
    <!-- El árbol del logo es lo más grande del hero (LCP) y la sombra del árbol de fondo de todas las páginas. Sin
         esto, el navegador no lo descubre hasta que React ha descargado y ejecutado su JavaScript (2026-11-18:
         empezaba a pedirse a los 4,7 s con un móvil lento simulado). Vite cambia la ruta por la del archivo final. -->
    <link rel="preload" as="image" href="/src/assets/logo-arbol.webp" fetchpriority="high" />
    <!-- El título, la descripción, las etiquetas para compartir (og:*), el canonical y los datos para Google los
         añade vite.config.ts (seoDesdeLosDatos) con los datos de src/data/: aquí no se escribe ninguno a mano. -->
  </head>
  <body>
    <div id="root"></div>
    <!--
      Formulario "fantasma" para Netlify Forms. Netlify busca los formularios en el HTML al publicar; el de verdad
      (src/components/secciones/FormularioVisita.tsx) lo pinta React en el navegador y Netlify no lo vería. Este,
      oculto, le dice el nombre del formulario y sus campos. Si se añade o cambia un campo allí, cambiarlo aquí.
      netlify-honeypot: bot-field es el campo trampa para los robots de spam.
    -->
    <form name="solicitar-visita" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="solicitar-visita" />
      <input name="bot-field" />
      <input name="nombre" />
      <input type="radio" name="nacido" value="Ya ha nacido" />
      <input type="date" name="nacimiento" />
      <input name="contacto" />
      <textarea name="mensaje"></textarea>
      <input type="checkbox" name="consentimiento" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
